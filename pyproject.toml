[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfchop"
version = "0.1.0"
description = "Overkilled 100% Offline PDF Swiss-Army Knife with Interactive Zero-Flicker TUI & CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "aotlover9", email = "developer@example.com" }
]
keywords = [
    "pdf", "pdf-compressor", "pdf-editor", "tui", "cli",
    "pymupdf", "opencv", "deskew", "offline", "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf>=1.23.0",
    "pillow>=9.0.0",
    "rich>=13.0.0",
    "opencv-python>=4.7.0",
    "reportlab>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pdfchop = "pdfchop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfchop"]
